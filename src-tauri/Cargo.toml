[package]
name = "peak-music-player"
version = "1.0.0"
description = "Mozgo, szinkronizalt dalszoveg a Spotifyhoz"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-localhost = "2"
tauri-plugin-global-shortcut = "2"

[profile.release]
opt-level = "s"
lto = true
strip = true
